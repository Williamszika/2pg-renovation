<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2PG — Suivi de chantier</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e3fa3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="2PG">
<link rel="apple-touch-icon" href="appletouchicon.png">
<link rel="icon" href="icone192.png" type="image/png">
<style>
:root {
  --fond:#f6f5f2; --surface:#fff; --surface-2:#efede8; --surface-3:#e7e4dd;
  --encre:#1b1f26; --encre-douce:#5a626e; --encre-pale:#8a909b;
  --trait:#e2dfd8; --trait-pale:#edebe5;
  --pigment:#2e3fa3; --pigment-pale:#e8eaf7;
  --ok:#2e7a57; --ok-pale:#e3f0ea;
  --alerte:#a8721a; --alerte-pale:#f6eedf;
  --arret:#a93a34; --arret-pale:#f7e7e5;
  --ombre:0 1px 2px rgba(27,31,38,.06), 0 8px 24px rgba(27,31,38,.07);
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,ui-serif,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fond:#111317; --surface:#191c21; --surface-2:#21252b; --surface-3:#2a2f36;
    --encre:#e9e7e2; --encre-douce:#99a0ab; --encre-pale:#6e7681;
    --trait:#2a2e35; --trait-pale:#222630;
    --pigment:#8496f5; --pigment-pale:#1d2340;
    --ok:#4fb183; --ok-pale:#14291f;
    --alerte:#d3a24a; --alerte-pale:#2c2416;
    --arret:#e2726b; --arret-pale:#2e1917;
    --ombre:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fond);color:var(--encre);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pigment);outline-offset:2px;border-radius:4px}
td.n,.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 72px}
.top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;padding-bottom:16px;border-bottom:1px solid var(--trait)}
.top h1{font-family:var(--serif);font-size:clamp(1.5rem,3.2vw,2rem);font-weight:700;letter-spacing:-.015em;line-height:1.15}
.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pigment)}
.jour{font-size:.88rem;color:var(--encre-pale);margin-top:3px}
.pile{display:flex;flex-direction:column;gap:18px;margin-top:22px}

.panel{background:var(--surface);border:1px solid var(--trait);border-radius:12px;overflow:hidden}
.panel.accent{border-color:var(--pigment)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--trait);background:var(--surface-2)}
.panel.accent .panel-head{background:var(--pigment-pale);border-bottom-color:var(--pigment)}
.panel-head h2{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--encre-douce)}
.panel.accent .panel-head h2{color:var(--pigment)}
.corps{padding:16px;display:flex;flex-direction:column;gap:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--trait);border-radius:12px;padding:13px 15px}
.kpi span{font-size:.63rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--encre-pale)}
.kpi b{display:block;font-size:1.7rem;font-weight:700;letter-spacing:-.025em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--alerte)} .kpi.bad b{color:var(--arret)}
.kpi b em{font-style:normal;font-size:.95rem;font-weight:600;color:var(--encre-pale)}

.champ{display:flex;flex-direction:column;gap:6px}
.champ>label,.label{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-pale)}
.champ input,.champ select{width:100%;border:1px solid var(--trait);border-radius:9px;padding:10px 11px;font-size:.92rem;background:var(--surface-2)}
.aide{font-size:.74rem;color:var(--encre-pale);line-height:1.45}
.aide.warn{color:var(--alerte)} .aide.bad{color:var(--arret)} .aide.ok{color:var(--ok)}
.deux{display:grid;gap:16px}
@media (min-width:640px){.deux{grid-template-columns:1fr 1fr}}

.seg{display:flex;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--trait);border-radius:9px}
.seg button{flex:1;padding:8px 4px;border-radius:6px;font-size:.8rem;font-weight:650;color:var(--encre-douce);line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--pigment);color:#fff}
.seg em{font-style:normal;display:block;font-size:.64rem;font-weight:600;opacity:.72}

.ac{display:flex;flex-direction:column;gap:8px}
.sug{list-style:none;border:1px solid var(--trait);border-radius:10px;overflow:hidden;background:var(--surface)}
.sug li+li{border-top:1px solid var(--trait-pale)}
.sug button{width:100%;text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.sug button:hover{background:var(--pigment-pale)}
.sug .v{font-size:.89rem;font-weight:600}
.sug .c{font-size:.76rem;color:var(--encre-pale)}
.sug .vide{padding:11px 12px;font-size:.82rem;color:var(--encre-pale)}
.choisie{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--pigment);background:var(--pigment-pale);border-radius:10px;padding:10px 12px}
.choisie .t{flex:1;min-width:0}
.choisie .t b{display:block;font-size:.9rem;font-weight:700}
.choisie .t span{font-size:.76rem;color:var(--encre-douce)}
.choisie .geo{font-family:var(--mono);font-size:.7rem;color:var(--pigment);background:var(--surface);border-radius:5px;padding:3px 7px;white-space:nowrap}

/* Aperçu cartographique : un géocodage peut poser le point au mauvais endroit,
   et l'ouvrier ne pourrait alors jamais confirmer. On le montre avant l'envoi. */
.apercu{border:1px solid var(--trait);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.apercu iframe{display:block;width:100%;height:190px;border:0}
.apercu .pied{display:flex;justify-content:space-between;align-items:center;gap:10px;
              padding:9px 11px;border-top:1px solid var(--trait);flex-wrap:wrap}
.apercu .pied span{font-size:.74rem;color:var(--encre-pale)}
.lien-gmaps{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:650;
            color:var(--pigment);border:1px solid var(--trait);border-radius:8px;
            padding:6px 11px;background:var(--surface);text-decoration:none;white-space:nowrap}
.lien-gmaps:hover{background:var(--pigment-pale)}
.lien-gmaps svg{width:14px;height:14px}


.dest{display:grid;gap:8px}
@media (min-width:640px){.dest{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}}
.dest label{display:flex;align-items:center;gap:10px;border:1px solid var(--trait);border-radius:10px;padding:11px 12px;cursor:pointer;background:var(--surface-2);font-size:.88rem;font-weight:600}
.dest label:hover{background:var(--surface-3)}
.dest label:has(input:checked){border-color:var(--pigment);background:var(--pigment-pale);color:var(--pigment)}
.dest input{width:18px;height:18px;accent-color:var(--pigment);flex:none;cursor:pointer}
.dest .qui{display:flex;flex-direction:column;min-width:0}
.dest .qui span{font-size:.72rem;font-weight:550;color:var(--encre-pale)}
.dest label:has(input:checked) .qui span{color:var(--pigment);opacity:.8}

.envoyer{background:var(--pigment);color:#fff;border-radius:11px;padding:14px;font-weight:700;font-size:.95rem;width:100%}
.envoyer:hover{filter:brightness(1.07)}
.envoyer:disabled{opacity:.4;cursor:not-allowed;filter:none}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-pale);padding:9px 16px;border-bottom:1px solid var(--trait);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--trait-pale);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n{text-align:right}
.qui-cell b{font-weight:650}
.qui-cell span{display:block;font-size:.74rem;color:var(--encre-pale);white-space:normal}
.retard{display:block;font-size:.72rem;font-weight:650;color:var(--alerte);white-space:nowrap}

.pastille{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap}
.pastille::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pastille.nodot::before{display:none}
.pastille.ok{color:var(--ok);background:var(--ok-pale)}
.pastille.warn{color:var(--alerte);background:var(--alerte-pale)}
.pastille.bad{color:var(--arret);background:var(--arret-pale)}
.pastille.idle{color:var(--encre-pale);background:var(--surface-2)}
.pastille.pig{color:var(--pigment);background:var(--pigment-pale)}

.barre{display:flex;align-items:center;gap:8px}
.barre .piste{flex:1;min-width:56px;height:6px;border-radius:4px;background:var(--surface-3);display:flex;overflow:hidden}
.barre .piste i{display:block;height:100%}
.barre .piste i.u{background:var(--ok)} .barre .piste i.q{background:var(--pigment)} .barre .piste i.o{background:var(--arret)}
.barre>span{font-size:.72rem;font-weight:650;color:var(--encre-pale);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

.btn-x{font-size:.76rem;font-weight:650;border:1px solid var(--trait);border-radius:7px;padding:5px 11px;background:var(--surface);color:var(--encre-douce)}
.btn-x:hover{background:var(--surface-3);color:var(--encre)}
.btn-x.solide{background:var(--pigment);color:#fff;border-color:var(--pigment)}
.btn-x.solide:hover{filter:brightness(1.08)}
.btn-x:disabled{opacity:.45;cursor:not-allowed}

.vide-msg{padding:24px 16px;text-align:center;font-size:.85rem;color:var(--encre-pale)}
.alerte-i{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--trait-pale);align-items:flex-start}
.alerte-i:last-child{border-bottom:0}
.alerte-i .txt{font-size:.85rem;min-width:0;flex:1}
.alerte-i .txt span{display:block;font-size:.73rem;color:var(--encre-pale);margin-top:1px}
.alerte-i time{font-size:.73rem;color:var(--encre-pale);font-variant-numeric:tabular-nums;white-space:nowrap}

.chantiers{display:grid;gap:12px;padding:16px}
@media (min-width:760px){.chantiers{grid-template-columns:1fr 1fr}}
.chantier{border:1px solid var(--trait);border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:9px}
.chantier .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chantier .h b{font-size:.92rem;font-weight:700}
.chantier .h span{display:block;font-size:.75rem;color:var(--encre-pale);margin-top:1px}
.chantier .m{display:flex;gap:16px}
.chantier .m div span{display:block;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-pale)}
.chantier .m div b{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums}
.chantier .m div.over b{color:var(--arret)}

.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.login-box .marque{font-size:.7rem;font-weight:800;letter-spacing:.25em;color:var(--pigment);text-align:center}
.login-box h1{font-family:var(--serif);font-size:1.7rem;font-weight:700;text-align:center;margin-bottom:12px;letter-spacing:-.02em}
.login-box .version{font-family:var(--mono);font-size:.68rem;color:var(--encre-pale);text-align:center;margin-top:4px}

.csv{margin:0 16px 16px;border:1px solid var(--trait);border-radius:9px;overflow:hidden}
.csv .h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:var(--surface-2)}
.csv .h b{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--encre-douce)}
.csv pre{font-family:var(--mono);font-size:.72rem;line-height:1.65;padding:12px;overflow-x:auto;color:var(--encre-douce);max-height:260px}

.mdp-ligne{display:flex;gap:8px;align-items:stretch}
.mdp-ligne input{flex:1;min-width:0}
.mdp-ligne .btn-x{flex:0 0 auto;white-space:nowrap}

/* Les identifiants du compte cree : le seul moment ou le mot de passe est
   lisible. Une fois cette carte fermee, plus personne ne peut le retrouver. */
.ident{border:1px solid var(--ok);background:var(--ok-pale);border-radius:10px;overflow:hidden;margin-top:10px}
.ident .h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px}
.ident .h b{font-size:.74rem;font-weight:700;color:var(--ok)}
/* Un seul bloc porte le fond blanc. Deux boites blanches accolees laisseraient
   au contraire une couture : leur frontiere tombe sur un demi-pixel, et le
   vert de la carte transparait dans l'antialiasing. */
.ident .corps{background:var(--surface);padding:8px 12px 12px}
.ident dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0 0 8px}
.ident dt{font-size:.72rem;color:var(--encre-pale);align-self:center}
.ident dd{font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--encre);word-break:break-all;user-select:all}
.ident .rappel{margin:0;font-size:.72rem;color:var(--encre-douce);line-height:1.5}

.sql-bloc{border:1px solid var(--alerte);background:var(--alerte-pale);border-radius:10px;overflow:hidden}
.sql-bloc .h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px}
.sql-bloc .h b{font-size:.74rem;font-weight:700;color:var(--alerte)}
.sql-bloc pre{font-family:var(--mono);font-size:.7rem;line-height:1.6;padding:12px;overflow-x:auto;background:var(--surface);color:var(--encre-douce);white-space:pre-wrap;word-break:break-word}

/* ══ Écran ouvrier ══════════════════════════════════════════════════════ */
.ouv{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
     padding:calc(14px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom))}
.ouv-tete{padding-bottom:14px}
.ouv-tete b{display:block;font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.ouv-tete span{font-size:.82rem;color:var(--encre-pale)}
.ouv-corps{flex:1;display:flex;flex-direction:column;gap:14px}
.ouv-pied{text-align:center;font-size:.7rem;color:var(--encre-pale);padding-top:14px;margin-top:14px;border-top:1px solid var(--trait-pale)}
.ouv-pied button{font-size:.7rem;color:var(--encre-pale);text-decoration:underline;margin-left:8px}

.notif{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:12px;background:var(--pigment);color:#fff}
.notif b{display:block;font-size:.92rem;font-weight:700}
.notif span{display:block;font-size:.8rem;opacity:.9;margin-top:1px}
.notif .cloche{font-size:1.1rem;line-height:1.2}

.adr-btn{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--trait);
         border-radius:14px;padding:16px;background:var(--surface)}
.adr-btn:hover{border-color:var(--pigment);background:var(--pigment-pale)}
.adr-btn .txt{flex:1;min-width:0}
.adr-btn .nom{display:block;font-size:.8rem;font-weight:650;color:var(--encre-pale)}
.adr-btn .rue{display:block;font-size:1.24rem;font-weight:700;line-height:1.3;margin-top:3px;letter-spacing:-.01em}
.adr-btn .ville{display:block;font-size:1.05rem;line-height:1.3}
.adr-btn .go{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--pigment)}
.adr-btn .go svg{width:28px;height:28px;display:block}
.adr-btn .go em{font-style:normal;font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}

.rdv{font-size:.85rem;color:var(--encre-douce);text-align:center}
.rdv b{color:var(--encre);font-weight:700}

.geo{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:7px}
.geo.in{background:var(--ok-pale)} .geo.out{background:var(--alerte-pale)}
.geo .l{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.geo .l b{font-size:.95rem;font-weight:700;flex:1}
.geo.in .l b{color:var(--ok)} .geo.out .l b{color:var(--alerte)}
.geo .l span{font-size:.8rem;font-weight:650;color:var(--encre-douce);white-space:nowrap}
.geo .prec{font-size:.78rem;font-weight:650;color:var(--arret)}

.gros{width:100%;border-radius:14px;padding:20px 16px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px}
.gros b{font-size:1.18rem;font-weight:700}
.gros span{font-size:.8rem;opacity:.88;text-align:center}
.gros.go{background:var(--ok)} .gros.stop{background:var(--arret)}
.gros.off{background:var(--surface-2);color:var(--encre-pale);cursor:not-allowed}
.gros:not(.off):hover{filter:brightness(1.06)}
.gros:not(.off):active{transform:scale(.99)}

.sec{width:100%;border:1px solid var(--trait);border-radius:12px;padding:13px;font-weight:650;font-size:.9rem;background:var(--surface);text-align:center}
.sec:hover{background:var(--surface-2)}
.sec.discret{color:var(--encre-douce);font-size:.85rem;padding:11px}

.chrono{background:var(--surface);border:1px solid var(--trait);border-radius:16px;padding:22px 14px;text-align:center}
.chrono .lab{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--encre-pale)}
.chrono .val{font-size:2.7rem;font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums}
.chrono.pause .val{color:var(--alerte)}
.chrono .sub{display:flex;justify-content:center;gap:18px;margin-top:13px;font-size:.8rem;color:var(--encre-douce);flex-wrap:wrap}
.chrono .sub b{font-variant-numeric:tabular-nums}

.note{font-size:.82rem;color:var(--encre-douce);background:var(--pigment-pale);border-radius:10px;padding:12px 13px;line-height:1.5}
.note b{color:var(--encre)}
.note.warn{background:var(--alerte-pale)} .note.ok{background:var(--ok-pale)}

.fin{text-align:center;padding:46px 16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.fin .rond{width:56px;height:56px;border-radius:50%;background:var(--ok-pale);color:var(--ok);display:flex;
           align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;margin-bottom:10px}
.fin b{font-size:1.15rem;font-weight:700}
.fin .d{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.fin .h{font-size:.86rem;color:var(--encre-pale);font-variant-numeric:tabular-nums}

.vide-ouv{text-align:center;padding:60px 14px;display:flex;flex-direction:column;gap:7px}
.vide-ouv b{font-size:1.05rem;font-weight:700;color:var(--encre-douce)}
.vide-ouv span{font-size:.88rem;color:var(--encre-pale)}

.feuille{position:fixed;inset:0;background:rgba(15,17,21,.45);display:flex;align-items:flex-end;z-index:50}
.feuille .boite{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;
                padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.feuille h3{font-size:1.05rem;font-weight:700}
.feuille p{font-size:.85rem;color:var(--encre-douce)}
.feuille textarea{min-height:84px;border:1px solid var(--trait);border-radius:10px;padding:11px;font-size:.95rem;
                  background:var(--surface-2);resize:vertical;width:100%}
.feuille .actes{display:flex;gap:10px}
.feuille .actes button{flex:1;border-radius:10px;padding:14px;font-weight:650;font-size:.92rem}

<!-- INJECTION:supabase-js -->
<script>
"use strict";
(function () {

// ══ Configuration ═════════════════════════════════════════════════════════
// L'URL et la clé publique sont faites pour être distribuées : elles ne
// donnent accès qu'à ce que les règles de sécurité de la base autorisent.
// La clé secrète n'a rien à faire ici et n'y est pas.
const CONFIG = {
  url: "https://xugujaxoqzsypltvzyny.supabase.co",
  cle: "sb_publishable__jvFyZBXCQaJoorIxLGJIQ_F0Us5-9N",
};

// Date de fabrication, inscrite par build.sh. Affichée sous le bouton de
// connexion : sans elle, « j'ai redéployé mais je vois l'ancienne version »
// n'est vérifiable qu'en comparant la taille des fichiers.
const VERSION = "__VERSION__";

// Adresse a transmettre aux ouvriers avec leurs identifiants.
const ADRESSE_APP = "https://williamszika.github.io/2pg-renovation/";

const sb = supabase.createClient(CONFIG.url, CONFIG.cle);
const $ = (id) => document.getElementById(id);

// ══ Formatage ═════════════════════════════════════════════════════════════
const dd = (n) => (n < 10 ? "0" + n : String(n));

function heure(d) {
  if (!d) return "—";
  const x = typeof d === "string" ? new Date(d) : d;
  return dd(x.getHours()) + ":" + dd(x.getMinutes());
}
function duree(min) {
  if (min == null) return "—";
  const m = Math.max(0, Math.round(min));
  const h = Math.floor(m / 60);
  return h === 0 ? m + " min" : h + " h " + dd(m % 60);
}
function ecart(min) {
  if (Math.abs(min) < 1) return "à l'heure";
  return (min > 0 ? "+ " : "− ") + duree(Math.abs(min));
}
function metres(m) {
  if (m == null) return "—";
  return m >= 1000 ? (m / 1000).toFixed(1).replace(".", ",") + " km" : Math.round(m) + " m";
}
function heuresDec(min) {
  if (min == null) return "—";
  return (Math.round((min / 60) * 10) / 10).toString().replace(".", ",") + " h";
}
function heureCourte(t) { return t ? t.slice(0, 5) : "—"; }
function jourISO(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + dd(d.getMonth() + 1) + "-" + dd(d.getDate());
}
// « dimanche 2 août » — en français seule la première lettre prend la majuscule.
function dateLongue(d) {
  const s = (d || new Date()).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function roleTexte(r) {
  return r === "patron" ? "Patron" : r === "chef_equipe" ? "Chef d'équipe" : "Ouvrier";
}

// Un « Failed to fetch » ne dit rien à un artisan sur un chantier. On traduit
// les cas qu'il rencontrera vraiment, et on laisse le reste tel quel plutôt
// que de masquer une erreur qu'on n'a pas prévue.
function messageLisible(m) {
  m = m || "";
  if (/failed to fetch|networkerror|load failed/i.test(m)) {
    return "Pas de connexion au serveur. Vérifiez votre connexion internet, puis réessayez.";
  }
  if (/invalid login/i.test(m)) return "Identifiant ou mot de passe incorrect.";
  if (/email not confirmed/i.test(m)) {
    return "Ce compte n'a pas été confirmé. L'administrateur doit le valider dans Supabase, "
         + "onglet Authentication → Users.";
  }
  if (/rate limit|too many/i.test(m)) {
    return "Trop de tentatives. Attendez une minute avant de réessayer.";
  }
  return m;
}

// ══ État ══════════════════════════════════════════════════════════════════
const S = {
  moi: null, entreprise: "",
  equipe: [], chantiers: [], missions: [], alertes: [], marges: [],
  form: { q: "", pick: null, chantierId: null, rayon: 50 },
  csv: null,
  suggestionsEnCours: null,
};

// ══ Connexion ═════════════════════════════════════════════════════════════
$("formLogin").addEventListener("submit", async (e) => {
  e.preventDefault();
  const b = $("btnLogin"), err = $("erreurLogin");
  b.disabled = true; b.textContent = "Connexion…"; err.hidden = true;
  const { error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim().toLowerCase(),
    password: $("mdp").value,
  });
  if (error) {
    err.textContent = messageLisible(error.message);
    err.hidden = false;
    b.disabled = false; b.textContent = "Se connecter";
    return;
  }
  await demarrer();
});

$("btnDeconnexion").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

async function demarrer() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { $("ecranLogin").hidden = false; $("ecranBord").hidden = true; return; }

  const { data: moi } = await sb.from("utilisateurs")
    .select("id, nom, role, entreprise_id").eq("id", user.id).maybeSingle();

  if (!moi) {
    $("erreurLogin").textContent =
      "Ce compte n'est rattaché à aucune entreprise. Contactez l'administrateur.";
    $("erreurLogin").hidden = false;
    $("btnLogin").disabled = false; $("btnLogin").textContent = "Se connecter";
    await sb.auth.signOut();
    return;
  }
  S.moi = moi;

  // Une seule application pour tout le monde : l'ouvrier voit son adresse du
  // jour, l'encadrement voit le suivi. Le rôle décide, pas deux installations.
  if (moi.role === "ouvrier") {
    $("ecranLogin").hidden = true;
    $("ecranOuvrier").hidden = false;
    await demarrerOuvrier();
    return;
  }

  const { data: ent } = await sb.from("entreprises").select("nom").eq("id", moi.entreprise_id).maybeSingle();
  S.entreprise = (ent && ent.nom) || "2PG Rénovation";

  $("ecranLogin").hidden = true;
  $("ecranBord").hidden = false;
  $("nomEntreprise").textContent = S.entreprise;
  $("ligneJour").textContent = dateLongue() + " · connecté en tant que " + moi.nom;

  remplirDurees();
  await charger();
  brancherTempsReel();
  // Les durées en cours avancent sans qu'aucun évènement ne soit émis :
  // le rafraîchissement périodique reste nécessaire même avec le temps réel.
  setInterval(charger, 60000);
  // Le retard d'un ouvrier qui n'est pas encore arrivé se calcule à l'affichage :
  // sans redessin, il resterait figé entre deux rechargements.
  setInterval(() => {
    if (!$("ecranBord").hidden) dessinerMissions();
  }, 30000);
}

// ══ Chargement ════════════════════════════════════════════════════════════
async function charger() {
  const [u, c, m, a, mg] = await Promise.all([
    sb.from("utilisateurs").select("*").eq("actif", true).order("nom"),
    sb.from("chantiers").select("*").in("statut", ["prevu", "en_cours"]).order("libelle"),
    sb.rpc("missions_du_jour", { p_jour: jourISO() }),
    sb.from("alertes").select("*").eq("lue", false).order("cree_le", { ascending: false }).limit(30),
    sb.from("v_marge_chantier").select("*"),
  ]);
  if (u.data) S.equipe = u.data;
  if (c.data) S.chantiers = c.data;
  if (m.data) S.missions = m.data;
  if (a.data) S.alertes = a.data;
  if (mg.data) S.marges = mg.data;
  dessiner();
}

function brancherTempsReel() {
  sb.channel("suivi")
    .on("postgres_changes", { event: "*", schema: "public", table: "pointages" }, charger)
    .on("postgres_changes", { event: "*", schema: "public", table: "mission_destinataires" }, charger)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "alertes" }, charger)
    .subscribe();
}

// ══ Rendu ═════════════════════════════════════════════════════════════════
function dessiner() {
  dessinerKpis();
  dessinerDestinataires();
  dessinerRaccourcis();
  dessinerAlertes();
  dessinerMissions();
  dessinerChantiers();
  dessinerEquipe();
  majBoutonEnvoi();
}

function dessinerKpis() {
  const tous = S.missions.flatMap((m) => m.destinataires || []);
  const surPlace = tous.filter((d) => d.etat === "confirme" && !d.depart).length;
  const attente = tous.filter((d) => d.etat === "envoye" || d.etat === "vue").length;
  const bloques = tous.filter((d) => d.etat === "probleme").length;
  const realise = tous.reduce((s, d) => s + Number(d.duree_min || 0), 0);
  // Le prévu ne compte que ceux qui ont confirmé : un ouvrier jamais arrivé ne
  // doit pas gonfler l'objectif de la journée.
  const prevu = S.missions.reduce((s, m) =>
    s + m.mission.duree_service_min * (m.destinataires || []).filter((d) => d.etat === "confirme").length, 0);

  $("kpis").innerHTML =
    '<div class="kpi ok"><span>Sur le chantier</span><b>' + surPlace + "</b></div>" +
    '<div class="kpi warn"><span>En attente</span><b>' + attente + "</b></div>" +
    '<div class="kpi bad"><span>Bloqués</span><b>' + bloques + "</b></div>" +
    '<div class="kpi"><span>Réalisé / prévu</span><b>' + heuresDec(realise) +
      "<em> / " + heuresDec(prevu) + "</em></b></div>";
}

function dessinerDestinataires() {
  const el = $("destinataires");
  if (!S.equipe.length) {
    el.innerHTML = '<p class="aide">Aucun compte enregistré.</p>';
    return;
  }
  const coches = new Set([...el.querySelectorAll("input:checked")].map((i) => i.dataset.id));
  el.innerHTML = S.equipe.map((u) =>
    '<label><input type="checkbox" data-id="' + u.id + '"' + (coches.has(u.id) ? " checked" : "") + ">" +
    '<span class="qui">' + esc(u.nom.split(" ")[0]) + "<span>" + roleTexte(u.role) + "</span></span></label>"
  ).join("");
  el.querySelectorAll("input").forEach((i) => i.addEventListener("change", majBoutonEnvoi));
}

function dessinerRaccourcis() {
  const bloc = $("blocRaccourcis");
  if (S.form.pick || !S.chantiers.length) { bloc.hidden = true; return; }
  bloc.hidden = false;
  $("raccourcis").innerHTML = S.chantiers.map((c) =>
    '<button type="button" class="btn-x" data-chantier="' + c.id + '">' + esc(c.libelle) + "</button>"
  ).join("");
  $("raccourcis").querySelectorAll("[data-chantier]").forEach((b) =>
    b.addEventListener("click", () => {
      const c = S.chantiers.find((x) => x.id === b.dataset.chantier);
      $("adr").value = [c.adresse, c.code_postal, c.ville].filter(Boolean).join(" ");
      $("libelle").value = c.libelle;
      S.form.chantierId = c.id;
      S.form.q = $("adr").value;
      S.form.pick = null;
      chercherAdresse();
      $("adr").focus();
    })
  );
}

function dessinerAlertes() {
  const c = $("compteurAlertes");
  c.textContent = S.alertes.length;
  c.className = "pastille " + (S.alertes.length ? "warn" : "idle");

  if (!S.alertes.length) {
    $("listeAlertes").innerHTML = '<p class="vide-msg">Rien à signaler.</p>';
    return;
  }
  const graves = ["absence", "hors_zone", "gps_insuffisant", "gps_suspect", "oubli_pointage"];
  $("listeAlertes").innerHTML = S.alertes.map((a) =>
    '<div class="alerte-i"><span class="pastille ' + (graves.includes(a.type) ? "bad" : "warn") + '"></span>' +
    '<div class="txt">' + esc(a.titre) + (a.detail ? "<span>" + esc(a.detail) + "</span>" : "") + "</div>" +
    "<time>" + heure(a.cree_le) + "</time>" +
    '<button type="button" class="btn-x" data-lue="' + a.id + '">Vu</button></div>'
  ).join("");
  $("listeAlertes").querySelectorAll("[data-lue]").forEach((b) =>
    b.addEventListener("click", async () => {
      await sb.from("alertes").update({ lue: true }).eq("id", b.dataset.lue);
      S.alertes = S.alertes.filter((x) => x.id !== b.dataset.lue);
      dessinerAlertes();
    })
  );
}

/**
 * Minutes écoulées depuis minuit, pour une heure « 08:00 » comme pour une date.
 *
 * On reconnaît une heure seule à sa forme, pas à son type : un horodatage ISO
 * est lui aussi une chaîne, et « 2026-08-02T10:21:00Z ».split(":")[0] vaut
 * « 2026-08-02T10 », dont Number() ne tire que NaN.
 */
function minutesDuJour(v) {
  if (typeof v === "string" && /^\d{1,2}:\d{2}/.test(v)) {
    const p = v.split(":");
    return Number(p[0]) * 60 + Number(p[1]);
  }
  const d = new Date(v);
  return d.getHours() * 60 + d.getMinutes();
}

/** Retard à l'arrivée, en minutes. Négatif si en avance. */
function retardArrivee(d, heureRdv) {
  const t = d.arrivee || d.confirme_le;
  if (!t) return null;
  return minutesDuJour(t) - minutesDuJour(heureRdv || "08:00");
}

/**
 * L'état se déduit des faits, personne ne le décide.
 *
 *   arrivé              → vert, avec le retard chiffré s'il y en a un
 *   pas encore arrivé   → gris avant l'heure, orange après, rouge à +30 min
 *   GPS insuffisant     → le seul cas où un humain doit trancher
 */
function etatDestinataire(d, heureRdv) {
  if (d.etat === "confirme") {
    if (d.depart) return '<span class="pastille idle">Journée close</span>';
    const r = retardArrivee(d, heureRdv);
    return r != null && r > 5
      ? '<span class="pastille ok">Sur le chantier</span>' +
        '<span class="pastille warn" style="margin-left:6px">Arrivé en retard</span>'
      : '<span class="pastille ok">Sur le chantier</span>';
  }
  if (d.etat === "probleme") return '<span class="pastille bad">GPS insuffisant</span>';

  const ecoule = minutesDuJour(new Date()) - minutesDuJour(heureRdv || "08:00");
  if (ecoule > 30) return '<span class="pastille bad">Absent</span>';
  if (ecoule > 5) return '<span class="pastille warn">En retard · ' + duree(ecoule) + "</span>";
  if (d.vue_le) return '<span class="pastille pig">Vue ' + heure(d.vue_le) + "</span>";
  return '<span class="pastille idle">Attendu ' + heureCourte(heureRdv) + "</span>";
}

/** Heure d'arrivée, et le retard juste en dessous s'il y en a un. */
function celluleArrivee(d, heureRdv) {
  const t = d.arrivee || d.confirme_le;
  if (!t) return "—";
  const r = retardArrivee(d, heureRdv);
  return heure(t) + (r != null && r > 5
    ? '<span class="retard">+ ' + duree(r) + " de retard</span>"
    : "");
}

function barreAvancement(fait, prevu) {
  if (fait == null) return '<span style="color:var(--encre-pale)">—</span>';
  const over = fait > prevu;
  const pct = Math.round((fait / prevu) * 100);
  const q = over ? (prevu / fait) * 100 : Math.min(100, pct);
  return '<div class="barre"><div class="piste"><i class="' + (over ? "q" : "u") + '" style="width:' + q + '%"></i>' +
    (over ? '<i class="o" style="width:' + (100 - q) + '%"></i>' : "") + "</div><span>" + pct + " %</span></div>";
}

function dessinerMissions() {
  const el = $("missions");
  if (!S.missions.length) {
    el.innerHTML = '<section class="panel"><div class="panel-head"><h2>Journée</h2></div>' +
      '<p class="vide-msg">Aucune adresse envoyée aujourd\'hui.<br>Le suivi apparaîtra ici dès le premier envoi.</p></section>';
    return;
  }
  el.innerHTML = S.missions.map((s) => {
    const m = s.mission, ds = s.destinataires || [];
    const lignes = ds.map((d) => {
      const fait = d.duree_min != null ? Number(d.duree_min) : null;
      return "<tr>" +
        '<td class="qui-cell"><b>' + esc(d.nom) + "</b>" + (d.motif ? "<span>« " + esc(d.motif) + " »</span>" : "") + "</td>" +

// api-adresse.data.gouv.fr : service public français, gratuit, sans clé, et
// meilleur que Google sur les adresses françaises puisque c'est la base
// officielle. La navigation, elle, reste déléguée à Google Maps ou Waze côté
// application mobile.
let minuteurRecherche = null;

$("adr").addEventListener("input", () => {
  S.form.q = $("adr").value;
  S.form.pick = null;

  clearTimeout(minuteurRecherche);

async function chercherAdresse() {
  const q = S.form.q.trim();
  const el = $("suggestions");
  if (S.form.pick || q.length < 3) { el.innerHTML = ""; return; }

  if (S.suggestionsEnCours) S.suggestionsEnCours.abort();
  const ctrl = new AbortController();
  S.suggestionsEnCours = ctrl;

  el.innerHTML = '<ul class="sug"><li class="vide">Recherche…</li></ul>';
  try {
    const url = new URL("https://api-adresse.data.gouv.fr/search/");
    url.searchParams.set("q", q);
    url.searchParams.set("limit", "6");
    url.searchParams.set("autocomplete", "1");
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const res = j.features.map((f) => ({
      label: f.properties.label, voie: f.properties.name,
      cp: f.properties.postcode, ville: f.properties.city,
      lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0],
      type: f.properties.type,
    }));
    if (!res.length) { el.innerHTML = '<ul class="sug"><li class="vide">Aucune adresse trouvée</li></ul>'; return; }
    el.innerHTML = '<ul class="sug">' + res.map((a, i) =>
      '<li><button type="button" data-sug="' + i + '"><span class="v">' + esc(a.voie) + "</span>" +
      '<span class="c">' + esc(a.cp + " " + a.ville) +
      (a.type !== "housenumber" ? " · adresse approximative" : "") + "</span></button></li>"
    ).join("") + "</ul>";
    el.querySelectorAll("[data-sug]").forEach((b) =>
      b.addEventListener("click", () => choisir(res[Number(b.dataset.sug)]))
    );
  } catch (e) {
    if (e.name === "AbortError") return;
    el.innerHTML = '<ul class="sug"><li class="vide">Recherche d\'adresse indisponible</li></ul>';
  }
}

const IC_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
  'stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/>' +

/** Lien Google Maps sur les coordonnées exactes, pas sur le texte de l'adresse. */
function lienGoogleMaps(lat, lon) {
  return "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lon;
}

/**
 * Aperçu cartographique, via OpenStreetMap : gratuit, sans clé ni compte de
 * facturation, là où une carte Google exigerait les deux. Le bouton, lui,
 * ouvre bien Google Maps — c'est ce que tout le monde connaît.
 */
function apercuCarte(lat, lon, rayon) {
  // Cadrage : environ six fois le rayon de confirmation, pour situer le point
  // dans sa rue sans perdre le contexte.
  const m = Math.max(300, rayon * 6);
  const dLat = m / 111320;
  const dLon = m / (111320 * Math.cos((lat * Math.PI) / 180));
  const bbox = [lon - dLon, lat - dLat, lon + dLon, lat + dLat].map((v) => v.toFixed(6)).join(",");
  const carte = "https://www.openstreetmap.org/export/embed.html?bbox=" + bbox +
                "&layer=mapnik&marker=" + lat + "," + lon;
  return '<div class="apercu">' +
    '<iframe src="' + carte + '" loading="lazy" title="Emplacement du chantier"></iframe>' +
    '<div class="pied"><span>Vérifiez que le point est au bon endroit</span>' +
    '<a class="lien-gmaps" href="' + lienGoogleMaps(lat, lon) + '" target="_blank" rel="noopener">' +
    IC_PIN + "Ouvrir dans Google Maps</a></div></div>";
}

/**
 * Mot de passe provisoire, tiré au sort.
 *
 * Il sera lu à voix haute ou recopié sur un bout de papier : on écarte donc
 * ce qui se confond à l'oral comme à l'œil — I, l, 1, O, 0, et les majuscules
 * qui obligent à préciser « en majuscule ». Deux syllabes prononçables et
 * trois chiffres se transmettent au téléphone sans se tromper.
 *
 * crypto.getRandomValues et non Math.random : ce mot de passe ouvre l'accès
 * aux données de l'entreprise le temps que l'ouvrier le change.
 */
function tirerMotDePasse() {
  const c = "bcdfgjkmnpqrstvwxz", v = "aeiou", ch = "23456789";
  const au = (s) => s[crypto.getRandomValues(new Uint32Array(1))[0] % s.length];
  let m = "";
  for (let i = 0; i < 3; i++) m += au(c) + au(v);
  m += "-";
  for (let i = 0; i < 3; i++) m += au(ch);
  return m;
}

$("btnTirerMdp").addEventListener("click", () => {

/**
 * Les identifiants, affichés une seule fois.
 *
 * Le mot de passe n'est lisible qu'ici : la base n'en garde qu'une empreinte
 * bcrypt, que personne ne sait inverser. Fermer cette carte sans l'avoir
 * transmis oblige à en fixer un nouveau.
 */
function montrerIdentifiants(nom, email, mdp, utilisable) {
  const message =
    "Bonjour " + nom.split(" ")[0] + ", voici tes identifiants pour l'application 2PG.\n\n" +
    "Adresse : " + ADRESSE_APP + "\n" +
    "E-mail : " + email + "\n" +
    "Mot de passe : " + mdp + "\n\n" +
    "Sur iPhone, ouvre le lien avec Safari puis Partager > Sur l'ecran d'accueil.\n" +
    "Sur Android, Chrome proposera d'installer l'application.";

  $("identifiants").innerHTML =
    '<div class="ident"><div class="h"><b>Identifiants de ' + esc(nom) + "</b>" +
    '<button type="button" class="btn-x" id="btnCopierIdent">Copier le message</button></div>' +
    '<div class="corps"><dl><dt>E-mail</dt><dd>' + esc(email) + "</dd>" +
    "<dt>Mot de passe</dt><dd>" + esc(mdp) + "</dd></dl>" +
    '<p class="rappel">' +
    (utilisable
      ? "Notez-le maintenant : il n'est lisible qu'ici. La base n'en conserve qu'une empreinte, personne ne pourra le retrouver ensuite."
      : "La confirmation par e-mail est active sur le projet : ce compte ne pourra pas se connecter tant que le lien reçu n'aura pas été ouvert.") +
    "</p></div></div>";

  $("btnCopierIdent").addEventListener("click", () => {
    navigator.clipboard.writeText(message).then(() => {
      $("btnCopierIdent").textContent = "Copié";
      setTimeout(() => ($("btnCopierIdent").textContent = "Copier le message"), 1800);
    });
  });
}

$("btnCreerOuvrier").addEventListener("click", async () => {
  const b = $("btnCreerOuvrier"), msg = $("msgEquipe"), sql = $("sqlSecours");
  const nom = $("ouvNom").value.trim();
  const email = $("ouvEmail").value.trim().toLowerCase();
  const mdp = $("ouvMdp").value;
  b.disabled = true; b.textContent = "Création…"; msg.hidden = true;
  sql.innerHTML = ""; $("identifiants").innerHTML = "";

  // Client jetable : signUp ouvrirait une session au nom du nouveau compte et
  // remplacerait celle du patron. Avec persistSession à false, la session du
  // patron reste intacte.
  const jetable = supabase.createClient(CONFIG.url, CONFIG.cle, {
    auth: { persistSession: false, autoRefreshToken: false },
  });
  const { data, error } = await jetable.auth.signUp({ email, password: mdp });

  if (error || !data.user) {
    montrerSecours(nom, email, error ? error.message : "compte non créé");
    b.disabled = false; b.textContent = "Créer le compte";
    return;
  }

  const { error: eLien } = await sb.rpc("rattacher_utilisateur", {
    p_user_id: data.user.id, p_nom: nom, p_role: "ouvrier", p_telephone: null,
  });

  if (eLien) {
    montrerSecours(nom, email, eLien.message);
    b.disabled = false; b.textContent = "Créer le compte";
    return;
  }

  // Sans session retournée, la confirmation par e-mail est active : le compte
  // existe mais ne pourra pas se connecter tant qu'il n'aura pas cliqué le lien.
  const utilisable = !!data.session;
  if (!utilisable) {
    msg.className = "aide warn";
    msg.textContent =
      "Compte créé, mais la confirmation par e-mail est active sur le projet : " +
      "il devra valider le lien reçu avant de pouvoir se connecter. Pour l'éviter : " +
      "Authentication → Sign In / Providers → Email → décocher « Confirm email ».";
    msg.hidden = false;
  }

  // Les identifiants restent affichés, eux : les champs se vident pour la
  // saisie suivante, mais le mot de passe doit rester lisible le temps de le
  // transmettre — c'est la seule occasion de le lire.
  montrerIdentifiants(nom, email, mdp, utilisable);
  $("ouvNom").value = ""; $("ouvEmail").value = ""; $("ouvMdp").value = "";
  b.textContent = "Créer le compte";
  await charger();
});

// Repli quand la création directe échoue — typiquement quand les inscriptions
// sont fermées sur le projet, ce qui est le réglage le plus sûr.
function montrerSecours(nom, email, raison) {
  const msg = $("msgEquipe");
  msg.className = "aide bad";
  msg.textContent = "Création directe impossible : " + raison;
  msg.hidden = false;

  const requete =
    "-- 1) Cree le compte de connexion dans Authentication > Users > Add user\n" +
    "--    E-mail : " + email + "\n" +
    "--    Coche « Auto Confirm User »\n\n" +
    "-- 2) Puis colle ceci dans le SQL Editor :\n" +
    "insert into utilisateurs (id, entreprise_id, nom, role)\n" +
    "select u.id, (select entreprise_id from utilisateurs where id = auth.uid()),\n" +
    "       '" + nom.replace(/'/g, "''") + "', 'ouvrier'\n" +
    "from auth.users u where u.email = '" + email.replace(/'/g, "''") + "'\n" +
    "on conflict (id) do update set nom = excluded.nom, role = excluded.role\n" +
    "returning nom, role;";

  $("sqlSecours").innerHTML =
    '<div class="sql-bloc"><div class="h"><b>À faire dans Supabase</b>' +
    '<button type="button" class="btn-x" id="btnCopierSql">Copier</button></div>' +
    "<pre>" + esc(requete) + "</pre></div>";
  $("btnCopierSql").addEventListener("click", () => {
    navigator.clipboard.writeText(requete).then(
      () => { $("btnCopierSql").textContent = "Copié"; },
      () => { $("btnCopierSql").textContent = "Copie impossible"; }
    );
  });
}

// ══════════════════════════════════════════════════════════════════════════
// OUTILS DU DÉVELOPPEUR
//
// Basculer entre les deux vues avec un seul compte. Sans cela, tester le
// parcours de l'ouvrier demande un deuxième compte et un deuxième téléphone.
// Ces outils ne changent aucun droit : les règles de sécurité restent celles
// du rôle, et le serveur refusera toujours ce qu'il refusait.
// ══════════════════════════════════════════════════════════════════════════


// ══════════════════════════════════════════════════════════════════════════
// ÉCRAN OUVRIER
// ══════════════════════════════════════════════════════════════════════════

const O = {
  data: null,          // réponse de ma_mission_du_jour()
  dist: null,          // distance en direct, calculée sur le téléphone
  precision: null,
  approche: false,     // signal de proximité déjà déclenché ?
  permis: null,        // la position est-elle autorisée ?
  suivi: null,         // identifiant du watchPosition
  feuille: null,       // "probleme" | "depart"
  motif: "",
  occupe: false,
  autoEnCours: false,  // une confirmation automatique est déjà partie
  confirmeAuto: false, // elle a réussi — on le dit à l'ouvrier
};

const IC_NAV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
  'stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>';

$("ouvDeconnexion").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

/**
 * Distance en mètres (haversine). Sert uniquement à l'affichage : la distance
 * qui fait foi est recalculée par PostGIS au moment du pointage, côté serveur.
 */
function distanceM(aLat, aLon, bLat, bLon) {
  const R = 6371000, rad = (d) => (d * Math.PI) / 180;
  const dLat = rad(bLat - aLat), dLon = rad(bLon - aLon);
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(rad(aLat)) * Math.cos(rad(bLat)) * Math.sin(dLon / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(s)));
}
function rayonApproche(r) { return Math.max(300, r * 5); }

async function demarrerOuvrier() {
  $("ouvBonjour").textContent = "Bonjour " + S.moi.nom.split(" ")[0];
  $("ouvDate").textContent = dateLongue();
  await chargerOuvrier();
  suivrePosition();
  // Le chrono avance sans requête réseau : il se recalcule depuis l'heure
  // d'arrivée, qui vient du serveur.
  setInterval(dessinerOuvrier, 1000);
  setInterval(chargerOuvrier, 60000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) chargerOuvrier();
  });
}

async function chargerOuvrier() {
  const { data, error } = await sb.rpc("ma_mission_du_jour");
  if (error) { dessinerOuvrier(messageLisible(error.message)); return; }
  O.data = data || null;
  if (O.data && O.data.etat === "envoye") {
    await sb.rpc("marquer_vue", { p_mission_id: O.data.mission.id });
  }
  dessinerOuvrier();
}

function suivrePosition() {
  if (!navigator.geolocation) { O.permis = false; dessinerOuvrier(); return; }
  if (O.suivi !== null) navigator.geolocation.clearWatch(O.suivi);
  O.suivi = navigator.geolocation.watchPosition(
    (p) => {
      O.permis = true;
      O.precision = p.coords.accuracy;
      if (O.data) {
        O.dist = distanceM(p.coords.latitude, p.coords.longitude,
                           O.data.mission.lat, O.data.mission.lon);
        if (!O.approche && O.dist <= rayonApproche(O.data.mission.rayon_m)) O.approche = true;
        confirmerSiArrive(p);
      }
      dessinerOuvrier();
    },
    (e) => { O.permis = e.code !== e.PERMISSION_DENIED ? null : false; dessinerOuvrier(); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}

/**
 * Confirmation automatique dès l'entrée dans le périmètre.
 *
 * L'ouvrier n'a rien à faire : franchir la limite du chantier suffit. Le bouton
 * reste affiché comme secours, pour le cas où il ouvre l'application alors
 * qu'il est déjà sur place et que la position n'a pas encore bougé.
 *
 * Le serveur revérifie tout de son côté — position, rayon, précision. Une
 * position falsifiée dans le navigateur ne passerait pas davantage ici qu'avec
 * un appui sur le bouton.
 */
function confirmerSiArrive(p) {
  if (O.autoEnCours || O.occupe) return;
  if (!O.data || O.data.etat === "confirme") return;
  const r = O.data.mission.rayon_m;
  if (O.dist == null || O.dist > r) return;
  if (p.coords.accuracy != null && p.coords.accuracy > r) return;

  O.autoEnCours = true;
  sb.rpc("confirmer_arrivee", {
    p_mission_id: O.data.mission.id,
    p_lat: p.coords.latitude, p_lon: p.coords.longitude, p_precision: p.coords.accuracy,
  }).then(({ data, error }) => {
    if (!error && data && data.ok) {
      O.confirmeAuto = true;
      O.approche = false;
      return chargerOuvrier();
    }
    // Refus du serveur ou réseau absent : on laisse l'ouvrier appuyer
    // lui-même, et on réessaiera au prochain relevé de position.
  }).finally(() => { O.autoEnCours = false; });
}

function positionMaintenant() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("Position indisponible"));
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, precision: p.coords.accuracy }),
      (e) => reject(new Error(e.code === e.PERMISSION_DENIED
        ? "Vous avez refusé l'accès à votre position."
        : "Position introuvable. Sortez à l'air libre et réessayez.")),
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
    );
  });
}

function dessinerOuvrier(erreur) {
  const c = $("ouvCorps");
  if (erreur) { c.innerHTML = '<div class="bandeau bad">' + esc(erreur) + "</div>"; return; }

  let h = "";
  if (O.permis === false) {
    h += '<div class="bandeau bad">L\'accès à votre position est refusé. ' +
         "Sans lui, impossible de confirmer votre arrivée. Autorisez-le dans les réglages du téléphone.</div>";
  }

  if (!O.data) {
    c.innerHTML = h + '<div class="vide-ouv"><b>Rien pour aujourd\'hui</b>' +
      "<span>Le bureau ne vous a envoyé aucune adresse.</span></div>";
    return;
  }

  const m = O.data.mission, j = O.data.journee || null;
  const rayon = m.rayon_m;
  const pres = O.dist != null && O.dist <= rayon;
  const fiable = O.precision == null || O.precision <= rayon;
  const peut = pres && fiable;

  const carteAdresse =
    '<button type="button" class="adr-btn" id="btnItineraire">' +
      '<span class="txt"><span class="nom">' + esc(m.libelle) + "</span>" +
      '<span class="rue">' + esc(m.adresse) + "</span>" +
      (m.code_postal || m.ville
        ? '<span class="ville">' + esc([m.code_postal, m.ville].filter(Boolean).join(" ")) + "</span>"
        : "") + "</span>" +
      '<span class="go">' + IC_NAV + "<em>Itinéraire</em></span></button>";

  if (O.data.etat !== "confirme") {
    if (O.approche && !peut) {
      h += '<div class="notif"><span class="cloche">🔔</span><span>' +
           "<b>Vous approchez du chantier</b>" +
           "<span>" + metres(O.dist) + " — " + esc(m.libelle) + "</span></span></div>";
    }
    h += carteAdresse;
    h += '<p class="rdv">Rendez-vous <b>' + heureCourte(m.heure_rdv) + "</b>  ·  " +
         duree(m.duree_service_min) + " de service</p>";
    h += '<div class="geo ' + (pres ? "in" : "out") + '"><div class="l">' +
         "<b>" + (pres ? "Vous êtes sur l'adresse" : "Approchez-vous de l'adresse") + "</b>" +
         "<span>" + (O.dist == null ? "recherche…" : metres(O.dist)) + "</span></div>" +
         (fiable ? "" : '<p class="prec">Précision GPS ± ' + Math.round(O.precision) + " m — insuffisante</p>") +
         "</div>";

    if (peut) {
      h += '<button type="button" class="gros go" id="btnArrive"><b>Je suis arrivé</b>' +
           "<span>Confirmation en cours…  ·  à " + metres(O.dist) + "</span></button>";
    } else {
      h += '<div class="gros off"><b>' +
           (!fiable ? "GPS trop imprécis"
             : O.dist == null ? "Recherche du signal…"
             : "Encore " + metres(O.dist - rayon)) + "</b><span>" +
           (!fiable ? "± " + Math.round(O.precision) + " m pour un seuil de " + rayon + " m"
             : "Le bouton s'active à moins de " + rayon + " m") + "</span></div>";
    }

    if (O.data.etat === "probleme") {
      h += '<div class="note warn"><b>Demande envoyée au bureau</b><br>« ' + esc(O.data.motif) + " »</div>";
    } else if (!peut) {
      h += '<button type="button" class="sec discret" id="btnProbleme">Je n\'arrive pas à confirmer</button>';
    }
  } else if (j && !j.en_cours) {
    h += '<div class="fin"><span class="rond">✓</span><b>Journée terminée</b>' +
         '<span class="d">' + duree(j.duree_min) + " sur le chantier</span>" +
         '<span class="h">' + heure(j.arrivee) + " – " + heure(j.depart) + "</span></div>";
  } else {
    const enPause = j && j.en_pause;
    const faites = j && j.arrivee
      ? Math.max(0, (Date.now() - new Date(j.arrivee).getTime()) / 60000 - Number(j.pause_min || 0))
      : 0;
    const finPrevue = j && j.arrivee
      ? new Date(new Date(j.arrivee).getTime() +
                 (m.duree_service_min + Number(j.pause_min || 0)) * 60000)
      : null;

    h += carteAdresse;
    if (O.confirmeAuto) {
      h += '<div class="note ok"><b>Présence confirmée automatiquement</b><br>' +
           "Vous êtes entré dans le périmètre du chantier à " + heure(j && j.arrivee) +
           ". Le bureau en a été informé.</div>";
    }
    h += '<div class="chrono' + (enPause ? " pause" : "") + '">' +
         '<p class="lab">' + (enPause ? "En pause" : "Sur le chantier depuis") + "</p>" +
         '<p class="val">' + duree(faites) + "</p>" +
         '<div class="sub"><span>Arrivé <b>' + heure(j && j.arrivee) + "</b></span>" +
         (finPrevue ? "<span>Fin prévue <b>" + heure(finPrevue) + "</b></span>" : "") +
         "</div></div>";

    if (enPause) {
      h += '<button type="button" class="gros go" data-pointer="pause_fin"><b>Reprendre</b>' +
           "<span>" + heure(new Date()) + "</span></button>";
    } else {
      h += '<button type="button" class="gros stop" data-pointer="depart"><b>J\'ai terminé</b>' +
           "<span>" + heure(new Date()) + "</span></button>" +
           '<button type="button" class="sec discret" data-pointer="pause_debut">Prendre ma pause</button>';
    }
  }

  if (O.feuille) {
    const estPb = O.feuille === "probleme";
    h += '<div class="feuille"><div class="boite">' +
      "<h3>" + (estPb ? "Signaler au bureau" : "Départ à " + metres(O.dist) + " du chantier") + "</h3>" +
      "<p>" + (estPb
        ? metres(O.dist) + "  ·  précision ± " + (O.precision ? Math.round(O.precision) : "?") + " m"
        : "Indiquez le motif.") + "</p>" +
      '<textarea id="champMotif" placeholder="' +
      (estPb ? "Ex. : je suis devant la porte mais le GPS ne descend pas"
             : "Ex. : j&apos;ai déjà chargé la camionnette") + '">' + esc(O.motif) + "</textarea>" +
      '<div class="actes"><button type="button" class="annule" id="btnAnnuleFeuille">Annuler</button>' +
      '<button type="button" class="ok" id="btnValideFeuille"' +
      (O.motif.trim().length < 3 ? " disabled" : "") + ">Envoyer</button></div></div></div>";
  }

  c.innerHTML = h;
  brancherOuvrier();
}

function brancherOuvrier() {
  const it = $("btnItineraire");
  if (it) it.addEventListener("click", ouvrirItineraire);

  const arr = $("btnArrive");
  if (arr) arr.addEventListener("click", confirmerArrivee);

  const pb = $("btnProbleme");
  if (pb) pb.addEventListener("click", () => { O.feuille = "probleme"; O.motif = ""; dessinerOuvrier(); });

  document.querySelectorAll("[data-pointer]").forEach((b) =>
    b.addEventListener("click", () => pointer(b.dataset.pointer))
  );

  const champ = $("champMotif");
  if (champ) {
    // Le chrono redessine chaque seconde : sans ça, le curseur reviendrait au
    // début du texte à chaque frappe.
    champ.focus();
    champ.setSelectionRange(champ.value.length, champ.value.length);
    champ.addEventListener("input", () => {
      O.motif = champ.value;
      const ok = $("btnValideFeuille");
      if (ok) ok.disabled = O.motif.trim().length < 3;
    });
  }
  const annule = $("btnAnnuleFeuille");
  if (annule) annule.addEventListener("click", () => { O.feuille = null; O.motif = ""; dessinerOuvrier(); });
  const valide = $("btnValideFeuille");
  if (valide) valide.addEventListener("click", validerFeuille);
}

/**
 * Itinéraire vers le chantier, dans Google Maps.
 *
 * On passe par l'URL universelle plutôt que par un schéma propre à la
 * plateforme (`geo:` ou `maps://`) : elle ouvre l'application Google Maps
 * quand elle est installée, iOS comme Android, et bascule sur la version web
 * sinon. Un `geo:` ouvrirait l'application de cartes par défaut, qui est Plans
 * sur iPhone.
 *
 * La destination est en coordonnées, pas en texte : elles viennent de la Base
 * Adresse Nationale et désignent exactement le point que le patron a validé sur
 * l'aperçu. Une adresse en toutes lettres pourrait être réinterprétée.
 */
function ouvrirItineraire() {
  const m = O.data.mission;
  window.open(
    "https://www.google.com/maps/dir/?api=1&destination=" + m.lat + "," + m.lon +
      "&travelmode=driving",
    "_blank", "noopener"
  );
}

async function confirmerArrivee() {
  if (O.occupe) return;
  O.occupe = true;
  try {
    const p = await positionMaintenant();
    const { data, error } = await sb.rpc("confirmer_arrivee", {
      p_mission_id: O.data.mission.id,
      p_lat: p.lat, p_lon: p.lon, p_precision: p.precision,
    });
    if (error) throw new Error(messageLisible(error.message));
    if (!data.ok) {
      alert(data.motif === "gps_insuffisant"
        ? "GPS trop imprécis : ± " + data.precision_m + " m. Il ne peut pas prouver que vous êtes à moins de "
          + data.rayon_m + " m."
        : "Vous êtes à " + metres(data.distance_m) + " du chantier. Approchez-vous.");
      return;
    }
    O.approche = false;
    await chargerOuvrier();
  } catch (e) {
    alert(e.message);
  } finally { O.occupe = false; }
}

async function pointer(type, motif) {
  if (O.occupe) return;
  O.occupe = true;
  try {
    let p = null;
    // Pas de GPS (sous-sol) : on pointe quand même, le serveur enregistre
    // simplement une position inconnue.
    try { p = await positionMaintenant(); } catch { /* position indisponible */ }

    const { data, error } = await sb.rpc("pointer", {
      p_mission_id: O.data.mission.id,
      p_type: type,
      p_lat: p ? p.lat : null, p_lon: p ? p.lon : null,
      p_precision: p ? p.precision : null,
      p_motif: motif || null,
    });
    if (error) throw new Error(messageLisible(error.message));
    if (data && data.ok === false && data.motif === "motif_requis") {
      O.feuille = "depart"; O.motif = ""; dessinerOuvrier();
      return;
    }
    await chargerOuvrier();
  } catch (e) {
    alert(e.message);
  } finally { O.occupe = false; }
}

async function validerFeuille() {
  const motif = O.motif.trim();
  if (motif.length < 3) return;
  const quoi = O.feuille;
  O.feuille = null; O.motif = "";

  if (quoi === "depart") { await pointer("depart", motif); return; }

  O.occupe = true;
  try {
    let p = null;
    try { p = await positionMaintenant(); } catch { /* position indisponible */ }
    const { error } = await sb.rpc("signaler_probleme", {
      p_mission_id: O.data.mission.id, p_motif: motif,
      p_lat: p ? p.lat : null, p_lon: p ? p.lon : null, p_precision: p ? p.precision : null,
    });
    if (error) throw new Error(messageLisible(error.message));
    await chargerOuvrier();
  } catch (e) {
    alert(e.message);
  } finally { O.occupe = false; }
}

// ══ Démarrage ═════════════════════════════════════════════════════════════
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      // Sans service worker l'application fonctionne, elle ne s'installe
      // simplement pas et ne démarre pas hors ligne.
    });
  });
}

$("versionApp").textContent = "version " + VERSION;

sb.auth.getSession().then(({ data }) => {
  if (data.session) demarrer();
  else $("ecranLogin").hidden = false;
});

})();
</script>
